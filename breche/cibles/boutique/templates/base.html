<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Morel Optique</title>
<style>body{margin:0;font:16px/1.5 Georgia,serif;background:#fbfaf7;color:#222}header{background:#123a5c;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}header a{color:#fff;text-decoration:none;font-size:22px;letter-spacing:.04em}main{max-width:960px;margin:0 auto;padding:24px 16px}.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.carte{background:#fff;border:1px solid #ddd;padding:16px}.prix{color:#123a5c;font-weight:bold}form.rech input{padding:8px;width:220px}button{background:#123a5c;color:#fff;border:0;padding:9px 14px;cursor:pointer}.err{background:#fdecea;padding:10px;font-family:monospace}footer{text-align:center;color:#888;font-size:13px;padding:32px}</style></head>
<body><header><a href="/">MOREL OPTIQUE <small>· depuis 1931</small></a><form class="rech" action="/recherche"><input name="q" placeholder="Rechercher un instrument" value="{{ q or '' }}"> <button>Chercher</button></form></header>
